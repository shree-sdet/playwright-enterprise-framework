# =============================================================================
# Grafana - Dashboard Loader
# =============================================================================
# WHAT THIS FILE DOES:
#   Tells Grafana to load dashboard JSON files automatically.
# =============================================================================

apiVersion: 1

providers:
  - name: Playwright Dashboards
    orgId: 1
    folder: Playwright
    folderUid: playwright
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
