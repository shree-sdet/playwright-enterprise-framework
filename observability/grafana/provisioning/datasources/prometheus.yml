# =============================================================================
# Grafana - Data Source
# =============================================================================
# WHAT THIS FILE DOES:
#   Tells Grafana to read metrics from Prometheus.
# =============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
