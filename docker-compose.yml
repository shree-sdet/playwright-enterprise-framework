version: '3.9'

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playwrightdb

    ports:
      - "5432:5432"

    volumes:
     - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 

  playwright:
    build: .

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: playwrightdb