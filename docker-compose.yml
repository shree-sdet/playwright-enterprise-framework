version: '3.9'

services:

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playwrightdb

    ports:
      - "5432:5432"

    volumes:
     - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright:
    build: .

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: playwrightdb
      CI: "true" 
      ENV: ${ENV}                        
      USERNAME: ${USERNAME}             
      PASSWORD: ${PASSWORD}              
      QA_BASE_URL: ${QA_BASE_URL}  

    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results 
      - ./allure-results:/app/allure-results