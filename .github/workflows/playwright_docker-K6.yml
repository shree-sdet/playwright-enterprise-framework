name: Playwright Docker CI

on:
  workflow_dispatch:

jobs:
  docker-test:

    environment: qa
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t playwright-framework .

      - name: Run Docker Compose
        env:
          ENV: qa
          USERNAME: ${{ secrets.QA_USERNAME }}
          PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_BASE_URL: ${{ secrets.QA_BASE_URL }}
        run: |
          docker compose up --build --abort-on-container-exit

      - name: Verify Report
        run: ls -la playwright-report || true

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

  k6-test:
    needs: docker-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install K6
        run: |
          sudo gpg -k
          sudo apt-get update
          sudo apt-get install -y gnupg software-properties-common
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Run Homepage Load Test
        run: k6 run performance/homepageLoadTest.js

      - name: Run API Performance Test
        run: k6 run performance/apiPerformanceTest.js

  contract-test:
    needs: docker-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Run Consumer Contract Test
        run: npx playwright test tests/contract-testing/consumer.spec.ts

      - name: Run Provider Verification Test
        run: npx playwright test tests/contract-testing/provider.spec.ts

      - name: Upload Contract Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-report
          path: playwright-report/

  deploy-report:
    if: always()
    needs: 
      - docker-test
      - k6-test
      - contract-test

    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Slack Notification
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Playwright Docker CI workflow completed: ${{ github.workflow }} - ${{ job.status }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nRun: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open Workflow Run>\nReport: <${{ steps.deployment.outputs.page_url }}|View Deployed Report>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
   