name: Playwright Visual Tests

run-name: >
  Visual Regression |
  ${{ github.event_name }} |
  ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    env:
      ENV: qa

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Visual Tests
        run: npx playwright test --project=visual-chromium --update-snapshots

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Visual Test Summary
        if: always()
        run: |
          echo "## Visual Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered By: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY

      - name: Slack Success Notification
        if: success()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ Visual Regression Tests PASSED

              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Triggered By: ${{ github.actor }}
              Workflow: ${{ github.workflow }}
              Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Slack Failure Notification
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ Visual Regression Tests FAILED

              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Triggered By: ${{ github.actor }}
              Workflow: ${{ github.workflow }}
              Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

              Check the GitHub Actions logs and uploaded visual artifacts.\"
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL }}
