name: Playwright Visual Tests

run-name: >
  Visual Regression |
  ${{ github.event_name }} |
  ${{ github.actor }}

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  visual-tests:
    runs-on: ubuntu-latest

    env:
      ENV: qa
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Visual Tests
        run: npx playwright test --project=visual-chromium --update-snapshots

      - name: Prepare Allure Results
        if: always()
        run: |
          mkdir -p allure-results
          cp config/allure-config/environment.properties allure-results/ || true
          cp config/allure-config/categories.json allure-results/ || true

      - name: Generate Allure Report
        if: always()
        run: npx --yes allure-commandline generate allure-results --clean -o allure-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Setup GitHub Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Allure Report To GitHub Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report/

      - name: Visual Test Summary
        if: always()
        run: |
          echo "## Visual Regression Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Repository: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered By: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: Completed" >> $GITHUB_STEP_SUMMARY

      - name: Slack Success Notification
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"Visual Regression Tests PASSED\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nTriggered By: ${{ github.actor }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Slack Failure Notification
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{"text":"Visual Regression Tests FAILED\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nTriggered By: ${{ github.actor }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nCheck the GitHub Actions logs and uploaded visual artifacts."}' \
            "$SLACK_WEBHOOK_URL"

  deploy-allure-report:
    if: always()
    needs:
      - visual-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Allure Report To GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Add Allure Report URL To Summary
        if: always()
        run: |
          echo "## Hosted Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Allure Report URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Open Allure Report](${{ steps.deployment.outputs.page_url }})" >> $GITHUB_STEP_SUMMARY
